<div class="text-input-container">
    <label *ngIf="label()" class="label">{{ label() }}:</label>
    <div class="input-wrapper">
        <input type="text" [value]="internalValue" [placeholder]="placeholder()" [disabled]="isDisabled"
            [readonly]="readonly()" [class.error]="hasError()" (input)="onInputChange($event)" (blur)="onBlur()"
            (focus)="onFocus()" (keyup.enter)="onEnter()" class="text-input" />
        <div class="icon-container" *ngIf="showIcon()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" class="user-icon">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
    </div>
    <div *ngIf="errorMessage() && hasError()" class="error-message">
        {{ errorMessage() }}
    </div>
    <div *ngIf="helperText()" class="helper-text">
        {{ helperText() }}
    </div>
</div>
