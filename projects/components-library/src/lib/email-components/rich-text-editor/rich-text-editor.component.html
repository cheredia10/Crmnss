<div class="rich-text-editor" [class.disabled]="disabled()">
    <!-- Toolbar -->
    <div class="toolbar">
        <!-- Font Family -->
        <div class="toolbar-group">
            <select class="font-select" [ngModel]="currentFont" (ngModelChange)="applyFontFamily($event)"
                [disabled]="disabled()" [title]="fontTooltip()">
                <option *ngFor="let font of fontOptions" [value]="font.value">
                    {{ font.name }}
                </option>
            </select>
        </div>

        <!-- Font Size -->
        <div class="toolbar-group">
            <select class="size-select" [ngModel]="currentSize" (ngModelChange)="applyFontSize($event)"
                [disabled]="disabled()" [title]="fontSizeTooltip()">
                <option *ngFor="let size of fontSizeOptions" [value]="size.value">
                    {{ size.name }}
                </option>
            </select>
        </div>

        <!-- Formatting Buttons -->
        <div class="toolbar-group">
            <button type="button" class="toolbar-btn" [class.active]="isBold" (click)="executeCommand('bold')"
                [disabled]="disabled()" [title]="boldTooltip()">
                <strong>B</strong>
            </button>
            <button type="button" class="toolbar-btn" [class.active]="isItalic" (click)="executeCommand('italic')"
                [disabled]="disabled()" [title]="italicTooltip()">
                <em>I</em>
            </button>
            <button type="button" class="toolbar-btn" [class.active]="isUnderline" (click)="executeCommand('underline')"
                [disabled]="disabled()" [title]="underlineTooltip()">
                <u>U</u>
            </button>
        </div>

        <!-- Text Color -->
        <div class="toolbar-group">
            <div class="color-picker-wrapper">
                <button type="button" class="toolbar-btn color-btn" (click)="toggleColorPicker()"
                    [disabled]="disabled()" [title]="textColorTooltip()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 20h16M8.5 14.5L12 11l3.5 3.5M12 6a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"></path>
                        <path d="M12 2v4"></path>
                    </svg>
                    <div class="color-indicator" [style.background-color]="currentColor"></div>
                </button>
                <div class="color-picker" [class.show]="showColorPicker">
                    <div class="color-grid">
                        <button *ngFor="let color of colorOptions" type="button" class="color-option"
                            [style.background-color]="color" (click)="applyColor(color)" [title]="color"></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lists -->
        <div class="toolbar-group">
            <button type="button" class="toolbar-btn" (click)="executeCommand('insertOrderedList')" [disabled]="disabled()"
                [title]="orderedListTooltip()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="10" y1="6" x2="21" y2="6"></line>
                    <line x1="10" y1="12" x2="21" y2="12"></line>
                    <line x1="10" y1="18" x2="21" y2="18"></line>
                    <path d="M4 6h1v4"></path>
                    <path d="M4 10h2"></path>
                    <path d="M6 18H4c0-1 0-2 1-3s1-1 1-1"></path>
                    <path d="M4 2h2v6"></path>
                </svg>
            </button>
            <button type="button" class="toolbar-btn" (click)="executeCommand('insertUnorderedList')" [disabled]="disabled()"
                [title]="unorderedListTooltip()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Link Button -->
        <div class="toolbar-group">
            <button type="button" class="toolbar-btn" (click)="insertLink()" [disabled]="disabled()"
                [title]="linkTooltip()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
            </button>

            <!-- NUEVO BOTÓN PARA ADJUNTAR ARCHIVOS -->
            <button type="button" class="toolbar-btn" (click)="attachFile.emit()" [disabled]="disabled()"
                [title]="attachFileTooltip()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.49">
                    </path>
                </svg>
            </button>
        </div>

        <!-- Alignment Buttons -->
        <div class="toolbar-group">
            <button type="button" class="toolbar-btn" [class.active]="currentAlign === 'left'"
                (click)="setAlignment('left')" [disabled]="disabled()" [title]="alignLeftTooltip()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="17" y1="10" x2="3" y2="10"></line>
                    <line x1="21" y1="6" x2="3" y2="6"></line>
                    <line x1="21" y1="14" x2="3" y2="14"></line>
                    <line x1="17" y1="18" x2="3" y2="18"></line>
                </svg>
            </button>
            <button type="button" class="toolbar-btn" [class.active]="currentAlign === 'center'"
                (click)="setAlignment('center')" [disabled]="disabled()" [title]="alignCenterTooltip()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="10" x2="6" y2="10"></line>
                    <line x1="21" y1="6" x2="3" y2="6"></line>
                    <line x1="21" y1="14" x2="3" y2="14"></line>
                    <line x1="18" y1="18" x2="6" y2="18"></line>
                </svg>
            </button>
            <button type="button" class="toolbar-btn" [class.active]="currentAlign === 'right'"
                (click)="setAlignment('right')" [disabled]="disabled()" [title]="alignRightTooltip()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="21" y1="10" x2="7" y2="10"></line>
                    <line x1="21" y1="6" x2="3" y2="6"></line>
                    <line x1="21" y1="14" x2="3" y2="14"></line>
                    <line x1="21" y1="18" x2="7" y2="18"></line>
                </svg>
            </button>
            <button type="button" class="toolbar-btn" [class.active]="currentAlign === 'justify'"
                (click)="setAlignment('justify')" [disabled]="disabled()" [title]="justifyTooltip()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="21" y1="10" x2="3" y2="10"></line>
                    <line x1="21" y1="6" x2="3" y2="6"></line>
                    <line x1="21" y1="14" x2="3" y2="14"></line>
                    <line x1="21" y1="18" x2="3" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- Editor Area -->
    <div #editor class="editor-content" contenteditable="true" [attr.data-placeholder]="placeholder()"
        (input)="onContentChange()" (blur)="onEditorBlur()" (focus)="onEditorFocus()" (paste)="onPaste($event)"></div>
</div>
