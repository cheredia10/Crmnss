<div class="status-select-container" [style.width]="width()" 
     [class.disabled]="isDisabled()" 
     [class.open]="isOpen()"
     [class.error]="hasError()" 
     [class]="customClass()" 
     (click)="toggleDropdown()" 
     (clickOutside)="closeDropdown()">
  
  <div class="status-select-display" [attr.id]="id()">
    @if (selectedOption(); as selected) {
      <!-- Mostrar el badge del estado seleccionado -->
      <lib-status-badge 
        [status]="selected.value" 
        [options]="statusOptions()">
      </lib-status-badge>
    } @else {
      <!-- Placeholder cuando no hay selección -->
      <span class="status-placeholder">{{ label() ?? placeholder() }}</span>
    }

    <!-- Arrow icon (same as Select2) -->
    <span class="status-arrow">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="19" viewBox="0 0 18 19" fill="none">
        <path
          d="M8.30048 14.3427L0.289763 6.45712C-0.0965876 6.07681 -0.0965876 5.46022 0.289763 5.07995L1.22409 4.16023C1.60978 3.78056 2.23487 3.77983 2.62147 4.1586L9.00002 10.4081L15.3785 4.1586C15.7651 3.77983 16.3902 3.78056 16.7759 4.16023L17.7102 5.07995C18.0966 5.46026 18.0966 6.07685 17.7102 6.45712L9.69956 14.3427C9.31321 14.723 8.68684 14.723 8.30048 14.3427Z"
          fill="#004179" />
      </svg>
    </span>
  </div>

  @if (isOpen()) {
    <div class="status-dropdown-menu">
      @for (option of options(); track option.value) {
        <div class="status-dropdown-option" 
             [class.selected]="option.value === value()" 
             (click)="selectOption(option, $event)">
          <lib-status-badge 
            [status]="option.value" 
            [options]="statusOptions()">
          </lib-status-badge>
        </div>
      }
    </div>
  }
</div>
