<!-- Modificamos el contenedor principal para no usar toggleDropdown si estamos añadiendo un nuevo item -->
<div
  class="dropdown-container"
  [style.width]="width()"
  [style.height]="inputHeight()"
  [class.disabled]="isDisabled()"
  [class.open]="isOpen()"
  [class.error]="hasError()"
  [class]="customClass()"
  (click)="toggleDropdown()"
  (clickOutside)="closeDropdown()"
  (scrollClose)="closeDropdown()"
>
  <!-- Usamos @if para alternar entre la vista normal y la vista de añadir -->
  @if (!isAddingNew()) {
  <div
    class="dropdown-selected"
    [attr.id]="id()"
    [class.custom-height]="inputHeight() !== 'auto'"
  >
    @if (selectedLabel()) {
    <span class="dropdown-label">{{ selectedLabel() }}</span>
    } @else {
    <span class="dropdown-placeholder">{{ label() ?? placeholder() }}</span>
    }
    <span class="dropdown-arrow">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="19"
        viewBox="0 0 18 19"
        fill="none"
      >
        <path
          d="M8.30048 14.3427L0.289763 6.45712C-0.0965876 6.07681 -0.0965876 5.46022 0.289763 5.07995L1.22409 4.16023C1.60978 3.78056 2.23487 3.77983 2.62147 4.1586L9.00002 10.4081L15.3785 4.1586C15.7651 3.77983 16.3902 3.78056 16.7759 4.16023L17.7102 5.07995C18.0966 5.46026 18.0966 6.07685 17.7102 6.45712L9.69956 14.3427C9.31321 14.723 8.68684 14.723 8.30048 14.3427Z"
          fill="#004179"
        />
      </svg>
    </span>
  </div>
  } @else {
  <!--NUEVO: Vista del input para añadir un nuevo elemento -->
  <div class="add-new-container" (click)="$event.stopPropagation()">
    <input
      #newInput
      type="text"
      class="add-new-input"
      placeholder="Escribe el nuevo valor..."
      [(ngModel)]="newInputValue"
      (keydown.enter)="handleNewInput()"
      (keydown.escape)="cancelAddNew()"
    />
    <button class="add-new-confirm" (click)="handleNewInput()">✓</button>
    <button class="add-new-cancel" (click)="cancelAddNew()">×</button>
  </div>
  } @if (isOpen()) {
  <div class="dropdown-menu" #dropdownMenu>
    <!--USAMOS EL NUEVO `displayedOptions` COMPUTED SIGNAL -->
    @for (option of displayedOptions(); track option.value) {
    <div
      class="dropdown-option"
      [class.selected]="option.value === value()"
      [class.add-new-option]="
        option.value.toString() === 'Symbol(ADD_NEW_OPTION)'
      "
      (click)="selectOption(option, $event)"
    >
      {{ option.label }}
    </div>
    }
  </div>
  }
</div>
