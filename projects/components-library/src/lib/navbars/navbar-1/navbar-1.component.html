<header class="lib-navbar">

  <!-- Botón hamburguesa (mobile) -->
  <button class="lib-navbar__menu-btn" (click)="menuClick.emit()" aria-label="Abrir menú lateral">
    <span class="material-icons">menu</span>
  </button>

  <!-- Título -->
  <div class="lib-navbar__title">
    <span class="material-icons title-icon">{{ appIcon }}</span>
    <span>{{ appTitle }}</span>
  </div>

  <!-- Spacer -->
  <div class="lib-navbar__spacer"></div>

  <!-- Usuario -->
  @if (user) {
    <div class="lib-navbar__user">
      @if (user.avatarUrl) {
        <img [src]="user.avatarUrl" class="user-avatar user-avatar--img" [alt]="user.nombre">
      } @else {
        <div class="user-avatar user-avatar--initials">
          {{ userInitials }}
        </div>
      }
      <div class="user-info">
        <span class="user-name">{{ user.nombre || 'Usuario' }}</span>
        <span class="user-email">{{ user.email || '' }}</span>
      </div>
    </div>
  }

</header>
