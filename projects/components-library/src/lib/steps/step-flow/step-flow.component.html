<div class="step-flow" [style.height.px]="height()">
  <svg class="flow-connections" [attr.width]="width()" [attr.height]="height()">
    <!-- Líneas de conexión -->
    @for (connection of connections(); track connection) {
      <g>
        <line [attr.x1]="connection.x1" [attr.y1]="connection.y1" [attr.x2]="connection.x2"
          [attr.y2]="connection.y2" [attr.stroke]="connection.color" stroke-width="2"
          [attr.stroke-dasharray]="connection.dashed ? '5,5' : 'none'" />
        </g>
      }
    </svg>

    <!-- Steps posicionados absolutamente -->
    @for (step of flowSteps(); track step; let i = $index) {
      <div class="flow-step" [style.left.px]="step.x || 0"
        [style.top.px]="step.y || 0">
        <div class="step-item" [ngClass]="getStepItemClasses(step)" (click)="onStepClick(step, i)">
          <!-- Step Indicator -->
          <div class="step-indicator">
            <svg class="step-default-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm2.7-2h8.6l.9-5.4-2.1 1.4L12 8l-3.1 2L6.8 8.6L7.7 14z" />
              </svg>
            </div>
            <!-- Step Label -->
            <div class="step-label">{{ step.label }}</div>
          </div>
        </div>
      }
    </div>
