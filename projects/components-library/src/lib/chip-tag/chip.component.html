<!-- chip.component.html -->
<div class="chip" [class.chip--filled]="type() === 'filled'" [class.chip--outline]="type() === 'outline'">
  @if (imageUrl()) {
    <img [src]="imageUrl()" class="chip__image" alt="avatar">
  }
  @if (!imageUrl() && icon()) {
    <mat-icon class="chip__icon">{{icon()}}</mat-icon>
  }
  <span class="chip__label">{{label()}}</span>

  <!-- === CAMBIO CLAVE AQUÍ === -->
  <!-- Añadimos el evento (click) que llama a nuestro nuevo método -->
  @if (showCloseButton()) {
    <mat-icon class="chip__close" (click)="onCloseClick($event)">
      close
    </mat-icon>
  }
</div>
