<div 
  class="event-card" 
  [class.event-card--today]="event().isToday">
  
  <div class="event-card__content">
    <!-- Fecha -->
    <div class="event-card__date">
      {{ event().date }}
    </div>
    
    <!-- Separador -->
    <div class="event-card__separator"></div>
    
    <!-- Información del evento -->
    <div class="event-card__info">
      <div class="event-card__company">{{ event().company }}</div>
      <div class="event-card__description">{{ event().description }}</div>
    </div>
  </div>
</div>
